<h2>Cadastro de Participantes</h2>

<input placeholder="Participante" [(ngModel)]="nome">
<input placeholder="Email" [(ngModel)]="email">
<select [(ngModel)]="oficina">
    <option>Teatro</option>
    <option>Trico</option>
    <option>Bolo</option>
</select><br><br>
<button (click)="cadastrar()">Cadastrar</button>
<br><br>
<a routerLink="/lista">Ver Participantes</a>
